<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="七秩·杭电时光 —— 杭州电子科技大学建校七十周年校史文化体验小游戏（思政实践作业）">
<title>七秩·杭电时光 · 杭州电子科技大学建校70周年校史小游戏</title>
<style>
/* ===== 七秩·杭电时光 ===== */
:root{
  --red:#b3122e;
  --red-d:#8a0d22;
  --red-l:#d8364f;
  --gold:#e3b465;
  --gold-l:#f7e0b0;
  --paper:#fbf6ea;
  --ink:#2a1a12;
  --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1a0d10;font-family:var(--sans);color:var(--ink);}
body{display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 0%, #4a1520 0%, #2a0d14 45%, #170a0e 100%);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px);
}
#app{position:relative}
#stage{
  position:relative;width:960px;height:600px;overflow:hidden;
  border-radius:14px;background:#111;
  box-shadow:0 0 0 1px rgba(227,180,101,.45), 0 0 0 7px rgba(0,0,0,.35),
             0 26px 70px rgba(0,0,0,.75), 0 0 90px rgba(179,18,46,.28);
  transform-origin:center center;
}
#cv{display:block;width:960px;height:600px}
.layer{position:absolute;inset:0;pointer-events:none}
.layer *{pointer-events:auto}
.hidden{display:none !important}

/* ---------- HUD ---------- */
.hud{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;gap:12px}
.hud-left{display:flex;align-items:center;gap:10px;background:rgba(26,13,16,.55);
  backdrop-filter:blur(6px);border:1px solid rgba(227,180,101,.35);border-radius:10px;padding:7px 13px 7px 9px}
.era{font-family:var(--serif);font-weight:700;font-size:19px;color:#0e0709;
  background:linear-gradient(180deg,var(--gold-l),var(--gold));padding:2px 9px;border-radius:6px;letter-spacing:.5px}
.cname{font-size:13.5px;color:#f4e8d4;letter-spacing:.4px;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-right{display:flex;align-items:center;gap:8px}
.frag{font-size:13px;color:#f4e8d4;background:rgba(26,13,16,.55);border:1px solid rgba(227,180,101,.35);
  border-radius:10px;padding:8px 12px;letter-spacing:1px;backdrop-filter:blur(6px)}
.frag b{color:var(--gold-l);font-size:15px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid rgba(227,180,101,.35);
  background:rgba(26,13,16,.55);color:#f4e8d4;font-size:15px;cursor:pointer;backdrop-filter:blur(6px);
  transition:.18s;display:grid;place-items:center}
.iconbtn:hover{background:rgba(179,18,46,.85);border-color:var(--gold);transform:translateY(-1px)}

/* ---------- 提示条 ---------- */
.hintbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  display:flex;gap:16px;background:rgba(26,13,16,.5);border:1px solid rgba(227,180,101,.22);
  border-radius:999px;padding:6px 16px;color:#dccdb3;font-size:11.5px;letter-spacing:.6px;
  backdrop-filter:blur(5px);white-space:nowrap}
.hintbar kbd{display:inline-block;background:rgba(247,224,176,.16);border:1px solid rgba(227,180,101,.4);
  border-radius:4px;padding:1px 5px;margin-right:4px;font-family:var(--sans);font-size:10.5px;color:var(--gold-l)}

/* ---------- 通用按钮 ---------- */
.btn{
  font-family:var(--sans);font-size:15px;letter-spacing:2px;color:#3a1108;
  background:linear-gradient(180deg,#f8e3b7,#dfa95b);border:1px solid #f7e8c8;
  border-radius:8px;padding:11px 30px;cursor:pointer;position:relative;
  box-shadow:0 4px 0 #8d6428, 0 10px 22px rgba(0,0,0,.4);transition:.12s;font-weight:700;
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 5px 0 #8d6428,0 12px 26px rgba(0,0,0,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8d6428,0 4px 10px rgba(0,0,0,.4)}
.btn.ghost{background:transparent;color:#e9d6b4;border:1px solid rgba(227,180,101,.5);
  box-shadow:none;font-weight:400;padding:9px 22px;font-size:13.5px}
.btn.ghost:hover{background:rgba(227,180,101,.12);transform:none}
.btn.sm{padding:8px 18px;font-size:13px;letter-spacing:1px}

/* ---------- 标题页 ---------- */
.title-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;
  background:radial-gradient(ellipse at 50% 42%, rgba(179,18,46,.42), transparent 62%);text-align:center}
.seal70{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:18px}
.seal70 .ring{position:absolute;inset:0;border:1.5px solid rgba(227,180,101,.55);border-radius:50%;
  animation:spin 24s linear infinite}
.seal70 .ring::before,.seal70 .ring::after{content:"";position:absolute;width:4px;height:4px;background:var(--gold);
  border-radius:50%;left:50%;top:-2px;margin-left:-2px}
.seal70 .ring::after{top:auto;bottom:-2px}
.seal70 .num{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1;color:#f8e2b4;
  letter-spacing:1px;text-shadow:0 2px 14px rgba(227,180,101,.55), 0 1px 0 rgba(140,90,30,.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.t-main{font-family:var(--serif);font-size:60px;font-weight:700;letter-spacing:10px;line-height:1.15;
  background:linear-gradient(180deg,#fff8e6 10%,#f0cd8b 55%,#c99a4e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 4px 26px rgba(179,18,46,.55);padding-left:10px}
.t-sub{margin-top:14px;font-size:13.5px;letter-spacing:4px;color:#e8cfa4;opacity:.92}
.t-line{margin:20px auto 6px;width:280px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(227,180,101,.75),transparent);position:relative}
.t-line::after{content:"◆";position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:9px;color:var(--gold)}
.t-tag{margin-top:10px;font-size:12px;color:#bfa98a;letter-spacing:2px}
.title-btns{margin-top:26px;display:flex;gap:14px;align-items:center}
.t-foot{position:absolute;bottom:14px;font-size:10.5px;color:rgba(240,225,200,.42);letter-spacing:1px}

/* ---------- 章节选择 ---------- */
.pick{background:rgba(14,6,9,.88);backdrop-filter:blur(10px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:26px;width:100%;height:100%}
.pick h2{font-family:var(--serif);font-size:24px;color:var(--gold-l);letter-spacing:6px;font-weight:700}
.pick h2 small{display:block;font-family:var(--sans);font-size:11px;color:#a9927a;letter-spacing:3px;margin-top:8px;font-weight:400}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;width:760px}
.tnode{position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(227,180,101,.2);
  border-radius:9px;padding:10px 12px;cursor:pointer;transition:.16s;text-align:left}
.tnode:hover:not(.locked){background:rgba(179,18,46,.35);border-color:var(--gold);transform:translateY(-2px)}
.tnode .y{font-family:var(--serif);font-size:17px;color:var(--gold-l);font-weight:700;letter-spacing:1px}
.tnode .n{font-size:11px;color:#cbb79b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .st{position:absolute;right:9px;top:10px;font-size:10px;color:var(--gold)}
.tnode.locked{opacity:.42;cursor:not-allowed}
.tnode.done{border-color:rgba(227,180,101,.55);background:rgba(227,180,101,.09)}

/* ---------- 章节片头 ---------- */
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 50%, rgba(20,8,11,.82), rgba(10,4,6,.96));cursor:pointer;width:100%;height:100%}
.intro .big{font-family:var(--serif);font-size:96px;font-weight:700;line-height:1;letter-spacing:4px;
  background:linear-gradient(180deg,#fff6e2,#e0b878 60%,#b3863f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.intro .h1{margin-top:6px;font-size:26px;color:#f7e8cc;letter-spacing:6px;font-family:var(--serif);font-weight:700}
.intro .meta{margin-top:14px;font-size:12.5px;color:#c0a887;letter-spacing:2.5px}
.intro .note{margin-top:22px;max-width:560px;font-size:13px;line-height:2;color:#dcc9ab;letter-spacing:.6px}
.intro .go{margin-top:30px;font-size:11.5px;color:rgba(240,225,200,.55);letter-spacing:3px;animation:blink 2.2s infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 校史卡片对话框 ---------- */
.dlg{position:absolute;left:34px;right:34px;bottom:26px;background:linear-gradient(180deg,#fdfaf2,#f4ecdb);
  border-radius:12px;border:1px solid #d9c49a;
  box-shadow:0 0 0 4px rgba(20,10,6,.55), 0 18px 40px rgba(0,0,0,.55);padding:18px 24px 14px;
  transform:translateY(0);transition:.22s cubic-bezier(.2,.8,.3,1)}
.dlg.hide{transform:translateY(26px);opacity:0;pointer-events:none}
.dlg-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dlg .yy{font-family:var(--serif);font-weight:700;font-size:15px;color:#fff3dc;background:var(--red);
  padding:3px 10px;border-radius:5px;letter-spacing:1px}
.dlg .tt{font-size:16.5px;font-weight:700;color:#4a2015;letter-spacing:1px}
.dlg .body{font-size:14.5px;line-height:1.95;color:#3b2a20;letter-spacing:.5px;min-height:56px;text-align:justify}
.dlg .body::after{content:"▌";color:var(--red);animation:blink 1s infinite;font-size:12px;margin-left:2px}
.dlg.done .body::after{content:""}
.dlg-bot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
  border-top:1px dashed #d8c6a3;padding-top:9px}
.dlg .src{font-size:10.5px;color:#9b8a72;letter-spacing:.5px}
.dlg .next{font-size:11px;color:var(--red);letter-spacing:2px;animation:blink 1.8s infinite}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:#d6c6a6;display:block}
.dots i.on{background:var(--red)}

/* ---------- 答题卡 ---------- */
.quizwrap{display:flex;align-items:center;justify-content:center;background:rgba(10,4,6,.72);backdrop-filter:blur(7px)}
.quiz{width:620px;background:linear-gradient(180deg,#fdfaf3,#f2e9d7);border-radius:14px;
  border:1px solid #d9c49a;box-shadow:0 0 0 5px rgba(227,180,101,.18),0 24px 60px rgba(0,0,0,.6);
  padding:24px 28px 22px;position:relative;overflow:hidden}
.quiz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--red),#7d0a1c)}
.quiz-kicker{font-size:10.5px;letter-spacing:4px;color:#a8743a;margin-bottom:9px}
.quiz-q{font-size:16.5px;line-height:1.7;color:#3a2116;font-weight:700;letter-spacing:.6px;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;background:#fffdf7;border:1px solid #e0d2b5;
  border-radius:8px;padding:11px 14px;cursor:pointer;transition:.14s;font-size:14px;color:#3f2c1f;
  line-height:1.5;text-align:left}
.opt .k{flex:0 0 20px;height:20px;border-radius:5px;background:#eee2c9;color:#7a5a2e;font-size:11.5px;
  display:grid;place-items:center;font-weight:700;margin-top:1px}
.opt:hover{border-color:#c9a35f;background:#fff8e6;transform:translateX(2px)}
.opt.right{background:#e8f5e2;border-color:#6aa84f}
.opt.right .k{background:#6aa84f;color:#fff}
.opt.wrong{background:#fbe6e6;border-color:#c0392b;animation:shake .32s}
.opt.wrong .k{background:#c0392b;color:#fff}
.opt.disabled{pointer-events:none;opacity:.65}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:13px;font-size:13px;line-height:1.75;color:#4a3524;background:rgba(227,180,101,.16);
  border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:9px 12px;display:none;letter-spacing:.4px}
.feedback.show{display:block;animation:fadeUp .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.quiz-foot{display:flex;justify-content:flex-end;margin-top:14px;gap:10px}

/* ---------- 通关页 ---------- */
.clear{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background-color:rgba(11,4,7,.93);
  background-image:radial-gradient(ellipse at 50% 46%, rgba(179,18,46,.34), rgba(179,18,46,0) 62%);
  gap:6px;width:100%;height:100%}
.clear .lab{font-size:11px;letter-spacing:6px;color:#d9bf93}
.clear .big{font-family:var(--serif);font-size:44px;color:#fff3d8;letter-spacing:8px;font-weight:700;
  text-shadow:0 3px 22px rgba(0,0,0,.6)}
.clear .row{display:flex;gap:26px;margin-top:16px}
.clear .cell{text-align:center}
.clear .cell b{display:block;font-family:var(--serif);font-size:26px;color:var(--gold-l)}
.clear .cell span{font-size:10.5px;color:#b9a184;letter-spacing:2px}
.clear .quote{margin-top:22px;font-size:13px;color:#e6d3b2;letter-spacing:1.5px}

/* ---------- 结局 ---------- */
.ending{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;width:100%;height:100%;
  background:linear-gradient(180deg, rgba(10,4,7,.20) 0%, rgba(10,4,7,.70) 24%,
    rgba(10,4,7,.84) 52%, rgba(10,4,7,.80) 100%)}
.end-crest{font-family:var(--serif);font-size:13px;letter-spacing:8px;color:var(--gold);opacity:0;animation:fadeUp .8s .2s forwards}
.end-motto{margin-top:16px;font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:12px;
  background:linear-gradient(180deg,#fff8e6,#e7bf7d 60%,#b8873c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(179,18,46,.5));padding-left:12px;opacity:0;animation:fadeUp 1s .5s forwards}
.end-mean{display:flex;gap:20px;margin-top:14px;opacity:0;animation:fadeUp 1s 1s forwards}
.end-mean div{font-size:11.5px;color:#cbb08a;letter-spacing:1px}
.end-mean div b{display:block;font-family:var(--serif);font-size:16px;color:var(--gold-l);letter-spacing:3px;margin-bottom:3px}
.end-line{margin-top:20px;font-size:12.5px;color:#dcc9ab;letter-spacing:3px;opacity:0;animation:fadeUp 1s 1.5s forwards}
.end-line em{font-style:normal;color:var(--gold-l);font-family:var(--serif);font-size:16px;letter-spacing:5px}
.end-stats{display:flex;gap:34px;margin-top:22px;opacity:0;animation:fadeUp 1s 1.9s forwards}
.end-stats .cell b{display:block;font-family:var(--serif);font-size:22px;color:#fff0d2}
.end-stats .cell span{font-size:10px;color:#a9927a;letter-spacing:2px}
.end-bless{margin-top:22px;width:430px;opacity:0;animation:fadeUp 1s 2.3s forwards}
.end-bless input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(227,180,101,.35);
  border-radius:7px;padding:9px 14px;color:#f5e8d2;font-family:var(--sans);font-size:13px;outline:none;text-align:center;letter-spacing:1px}
.end-bless input:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
.end-bless input::placeholder{color:#8f7a63}
.end-btns{display:flex;gap:12px;margin-top:20px;opacity:0;animation:fadeUp 1s 2.6s forwards}

/* ---------- 记忆墙 / 弹窗 ---------- */
.overlay{background:rgba(10,4,6,.86);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center}
.panel{width:780px;max-height:520px;background:linear-gradient(180deg,#fdfaf2,#f3ebda);border-radius:13px;
  border:1px solid #d9c49a;box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
  background:linear-gradient(180deg,#8a0d22,#6d0a1b);color:#f7e6c8}
.panel-h h3{font-family:var(--serif);font-size:16px;letter-spacing:4px;font-weight:700}
.panel-h .x{cursor:pointer;font-size:18px;line-height:1;color:#e8cfa8;padding:2px 6px;border-radius:4px}
.panel-h .x:hover{background:rgba(255,255,255,.15)}
.panel-b{padding:18px 20px;overflow-y:auto;flex:1}
.panel-b::-webkit-scrollbar{width:8px}
.panel-b::-webkit-scrollbar-thumb{background:#d3c3a2;border-radius:4px}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.memcard{background:#fffdf7;border:1px solid #e2d4b8;border-radius:8px;padding:6px 10px;cursor:pointer;transition:.14s}
.memcard:hover{border-color:#c9a35f;background:#fff8e6}
.memcard .y{font-size:10px;color:var(--red);font-weight:700;letter-spacing:.5px}
.memcard .t{font-size:11.5px;color:#3f2c1f;margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memcard.lock{opacity:.4;cursor:default}
.memcard.lock .t{color:#8a7660}
.help p{font-size:13px;line-height:1.95;color:#3f2c1f;margin-bottom:8px;letter-spacing:.3px}
.help b{color:var(--red)}
.help .kbdrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.help .kb{background:#efe3c9;border-radius:5px;padding:2px 8px;font-size:11.5px;color:#6b4a1f;border:1px solid #ddc9a2}

/* ---------- 浮动文字 ---------- */
.float{position:absolute;pointer-events:none;font-family:var(--serif);font-size:15px;font-weight:700;
  color:var(--red);text-shadow:0 1px 0 #fff;animation:floatUp 1.15s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.85)}
  18%{opacity:1;transform:translate(-50%,-14px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
.toast{position:absolute;pointer-events:none;left:50%;top:72px;transform:translateX(-50%);
  background:rgba(26,13,16,.9);border:1px solid rgba(227,180,101,.45);color:#f4e2c2;
  padding:9px 20px;border-radius:999px;font-size:12.5px;letter-spacing:1.5px;
  animation:toastIn .3s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- 触屏控制 ---------- */
.touch{display:none;position:absolute;inset:0;pointer-events:none}
.touch.show{display:block}
.dpad{position:absolute;left:20px;bottom:20px;width:132px;height:132px;pointer-events:auto}
.dpad button{position:absolute;width:42px;height:42px;border-radius:9px;border:1px solid rgba(227,180,101,.4);
  background:rgba(20,10,13,.55);color:#f0dcbc;font-size:15px;backdrop-filter:blur(4px)}
.dpad .u{left:45px;top:0}.dpad .l{left:0;top:45px}.dpad .r{left:90px;top:45px}.dpad .d{left:45px;top:90px}
.actbtn{position:absolute;right:22px;bottom:28px;width:74px;height:74px;border-radius:50%;
  border:1px solid rgba(227,180,101,.55);background:rgba(179,18,46,.7);color:#fff3d8;
  font-size:13px;letter-spacing:1px;pointer-events:auto;backdrop-filter:blur(4px)}


/* ---------- 手工痕迹：便签 / 版本戳 / 批注 ---------- */
.tape-note{position:absolute;right:42px;top:86px;width:138px;padding:16px 12px 12px;
  background:linear-gradient(170deg,#fbe9a8,#f3d97e);transform:rotate(-3.2deg);
  box-shadow:2px 4px 12px rgba(0,0,0,.35);border-radius:2px;color:#5c4318;
  font-family:var(--serif);line-height:1.7;letter-spacing:.5px;z-index:3}
.tape-note::before{content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%) rotate(1.5deg);
  width:56px;height:20px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.5);
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tape-note .tn-t{font-size:14px;text-align:center;font-weight:700}
.tape-note .tn-s{margin-top:8px;text-align:right;font-size:11px;opacity:.72}
.ver-stamp{position:absolute;left:16px;bottom:12px;font-size:10px;letter-spacing:1px;

function fr(c, x, y, w, h, col){ c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function sr(c, x, y, w, h, col, lw){
  const l = lw || 2;
  c.strokeStyle = col; c.lineWidth = l;
  c.strokeRect(Math.round(x) + l/2, Math.round(y) + l/2, Math.round(w) - l, Math.round(h) - l);
}
function sh(c, x, y, rx, ry, a, col){
  c.save(); c.fillStyle = col || ('rgba(34,22,12,' + (a == null ? .16 : a) + ')');
  c.beginPath(); c.ellipse(Math.round(x), Math.round(y), rx, ry, 0, 0, 6.2832); c.fill(); c.restore();
}
function circle(c, x, y, r, col){ c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill(); }

const BSTYLE = {
  mud:      { w:'#cfbb92', w2:'#bba57a', roof:'#8c7a55', trim:'#6b5c3f', win:'#a9c0b0', door:'#6d4c31', base:'#a08c65' },

  concrete: { w:'#d9d5c9', w2:'#c2bdb0', roof:'#918d81', trim:'#6b675d', win:'#a8c7d6', door:'#5a564c', base:'#bcb7aa' },

  glass:    { w:'#d5e7ee', w2:'#aecdd9', roof:'#7fa3b3', trim:'#52707d', win:'#95d3ea', door:'#3f5b66', base:'#b6d3de' },

/* ---------------- 地面 ---------------- */
function drawGround(c, ch, decals){
  const g = GROUNDS[ch.ground];
  fr(c, 0, 0, 960, 600, g.base);

  // 大块色差，制造旧照片般的斑驳
  c.save(); c.globalAlpha = .55;
  for (let i = 0; i < 26; i++){
    const s = decals.big[i];
    fr(c, s.x, s.y, s.w, s.h, i % 2 ? g.alt : g.base);
  }
  c.restore();

  // 道路
  ch.paths.forEach(p => {
    fr(c, p.x, p.y, p.w, p.h, g.path);
    fr(c, p.x, p.y, p.w, 2, 'rgba(255,255,255,.12)');
    fr(c, p.x, p.y + p.h - 2, p.w, 2, 'rgba(60,45,30,.14)');
    if (p.w > p.h){
      fr(c, p.x, p.y, 2, p.h, 'rgba(60,45,30,.10)');
      fr(c, p.x + p.w - 2, p.y, 2, p.h, 'rgba(60,45,30,.10)');
    }
  });

  // 地面装饰
  decals.small.forEach(d => {
    if (d.t === 0) fr(c, d.x, d.y, d.s, d.s, g.dc);
    else if (d.t === 1){
      c.fillStyle = g.dc; c.globalAlpha = .7;
      c.beginPath(); c.ellipse(d.x, d.y, d.s, d.s * .55, 0, 0, 6.2832); c.fill();
      c.globalAlpha = 1;
    } else if (d.t === 2){
      fr(c, d.x, d.y, d.s, 1, g.dc);
    } else {
      circle(c, d.x, d.y, d.s, d.c || g.dc);
    }
  });
}

function drawHall(c, p){
  const s = BSTYLE[p.style] || BSTYLE.brick;
  const x = p.x, y = p.y, w = p.w, h = p.h;
  sh(c, x + w / 2, y + h + 3, w * .46, 8, .16);

  // 屋檐
  fr(c, x - 7, y - 12, w + 14, 17, s.roof);
  fr(c, x - 7, y - 12, w + 14, 4, 'rgba(255,255,255,.20)');
  fr(c, x - 7, y + 3, w + 14, 3, 'rgba(0,0,0,.12)');
  sr(c, x - 7, y - 12, w + 14, 17, 'rgba(38,26,16,.42)', 1);

  fr(c, x, y + 5, w, h - 5, s.w);
  fr(c, x + w - 15, y + 5, 15, h - 5, s.w2);
  fr(c, x, y + 5, w, 6, 'rgba(0,0,0,.07)');
  fr(c, x, y + h - 13, w, 13, s.base);
  fr(c, x, y + h - 13, w, 2, 'rgba(255,255,255,.14)');

  // 风格细节
  if (p.style === 'brick'){
    c.save(); c.globalAlpha = .13;
    for (let yy = y + 14; yy < y + h - 14; yy += 9) fr(c, x + 1, yy, w - 2, 1, '#3a1a10');
    c.restore();
  } else if (p.style === 'glass'){
    c.save(); c.globalAlpha = .30;
    for (let xx = x + 8; xx < x + w - 8; xx += 22) fr(c, xx, y + 5, 2, h - 18, '#ffffff');
    c.restore();
    c.save(); c.globalAlpha = .10;
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(x + 10, y + h - 20); c.lineTo(x + w * .5, y + 12);
    c.lineTo(x + w * .68, y + 12); c.lineTo(x + 10, y + h - 32); c.fill();
    c.restore();
  } else if (p.style === 'concrete'){
    c.save(); c.globalAlpha = .16;
    for (let xx = x + 24; xx < x + w - 10; xx += 26) fr(c, xx, y + 5, 1, h - 18, '#5b574d');
    c.restore();
  }

  // 窗
  const rows = p.rows || 3, cols = p.cols || 5;
  const padT = 22, padB = 30, padL = 16, padR = 22;
  const aw = (w - padL - padR) / cols, ah = (h - padT - padB) / rows;
  for (let r = 0; r < rows; r++){
    for (let cc = 0; cc < cols; cc++){
      const wx = x + padL + cc * aw + aw * .16;
      const wy = y + padT + r * ah + ah * .18;
      const ww = aw * .68, wh = ah * .56;
      if (ww < 5) continue;
      fr(c, wx, wy, ww, wh, s.win);
      fr(c, wx, wy, ww, 2, 'rgba(255,255,255,.45)');
      fr(c, wx + ww * .48, wy, 1, wh, 'rgba(60,80,90,.35)');
      fr(c, wx, wy + wh * .5, ww, 1, 'rgba(60,80,90,.28)');
      sr(c, wx, wy, ww, wh, 'rgba(40,30,20,.35)', 1);
    }
  }

  // 门
  const dw = Math.min(40, w * .16), dh = Math.min(38, h * .30);
  const dx = x + w / 2 - dw / 2, dy = y + h - 13 - dh;
  fr(c, dx, dy, dw, dh, s.door);
  fr(c, dx, dy, dw, 3, 'rgba(255,255,255,.18)');
  fr(c, dx + dw / 2 - 1, dy, 2, dh, 'rgba(0,0,0,.25)');
  sr(c, dx, dy, dw, dh, 'rgba(30,20,12,.5)', 1);
  // 台阶
  fr(c, dx - 6, y + h - 13, dw + 12, 5, s.base);
  fr(c, dx - 9, y + h - 8, dw + 18, 4, s.w2);

  sr(c, x, y + 5, w, h - 5, 'rgba(45,30,20,.42)', 2);
}

function drawLibrary(c, p){
  const x = p.x, y = p.y, w = p.w, h = p.h;
  sh(c, x + w / 2, y + h + 3, w * .47, 9, .17);
  // 坡屋顶
  fr(c, x - 10, y - 18, w + 20, 22, '#5f6f79');
  fr(c, x - 10, y - 18, w + 20, 4, 'rgba(255,255,255,.24)');
  sr(c, x - 10, y - 18, w + 20, 22, 'rgba(38,26,16,.45)', 1);
  // 主体
  fr(c, x, y + 4, w, h - 4, '#efe9dc');
  fr(c, x, y + 4, w, 5, 'rgba(0,0,0,.10)');
  fr(c, x + w - 12, y + 4, 12, h - 4, '#ded6c5');
  // 檐部横带
  fr(c, x, y + 10, w, 9, '#e3dac6');
  fr(c, x, y + 10, w, 1, '#f7f2e6');
  fr(c, x, y + 19, w, 2, 'rgba(90,75,50,.18)');

  // 立柱
  const n = 5, step = (w - 34) / (n - 1);
  for (let i = 0; i < n; i++){
    const cx = x + 17 + i * step - 8;
    fr(c, cx, y + 22, 16, h - 40, '#f7f2e6');
    fr(c, cx + 11, y + 22, 5, h - 40, '#e0d6c0');
    sr(c, cx, y + 22, 16, h - 40, 'rgba(120,105,80,.35)', 1);
    fr(c, cx - 3, y + 20, 22, 4, '#e8dfca');
    fr(c, cx - 3, y + h - 20, 22, 4, '#e8dfca');
  }
  // 柱间高窗
  for (let i = 0; i < n - 1; i++){
    const wx = x + 17 + i * step + 10;
    const ww = step - 30, wy = y + 28, wh = h - 52;
    fr(c, wx, wy, ww, wh, '#9ec3d2');
    fr(c, wx, wy, ww, 2, 'rgba(255,255,255,.45)');
    for (let k = 1; k < 3; k++) fr(c, wx + k * ww / 3, wy, 1, wh, 'rgba(60,90,100,.42)');
    for (let k = 1; k < 2; k++) fr(c, wx, wy + k * wh / 2, ww, 1, 'rgba(60,90,100,.30)');
    sr(c, wx, wy, ww, wh, 'rgba(50,40,25,.35)', 1);
  }
  // 台阶（三层）
  fr(c, x + w / 2 - 36, y + h - 16, 72, 6, '#e8dfca');
  fr(c, x + w / 2 - 46, y + h - 10, 92, 5, '#d8cfb8');
  fr(c, x + w / 2 - 56, y + h - 5, 112, 4, '#c9c0a8');
  sr(c, x, y + 4, w, h - 4, 'rgba(45,30,20,.42)', 2);
}

function drawWorkshop(c, p){
  const s = BSTYLE.concrete, x = p.x, y = p.y, w = p.w, h = p.h;
  sh(c, x + w / 2, y + h + 3, w * .47, 8, .17);
  // 锯齿屋顶
  const teeth = Math.max(3, Math.round(w / 56));
  const tw = w / teeth;
  c.beginPath();
  c.moveTo(x - 4, y + 6);
  for (let i = 0; i < teeth; i++){
    c.lineTo(x + i * tw, y - 16);
    c.lineTo(x + (i + 1) * tw, y + 6);
  }
  c.lineTo(x + w + 4, y + 6);
  c.lineTo(x + w + 4, y + 2);
  c.lineTo(x - 4, y + 2);
  c.closePath();
  c.fillStyle = '#8b8779'; c.fill();
  c.strokeStyle = 'rgba(38,26,16,.42)'; c.lineWidth = 1.5; c.stroke();
  fr(c, x - 4, y + 2, w + 8, 5, '#6f6b60');

  fr(c, x, y + 6, w, h - 6, s.w);
  fr(c, x + w - 15, y + 6, 15, h - 6, s.w2);
  fr(c, x, y + h - 12, w, 12, s.base);
  // 高窗
  const n = Math.max(2, Math.round(w / 64));
  const bw = (w - 28) / n;
  for (let i = 0; i < n; i++){
    const wx = x + 14 + i * bw + bw * .12, ww = bw * .7;
    fr(c, wx, y + 22, ww, 24, s.win);
    fr(c, wx, y + 22, ww, 2, 'rgba(255,255,255,.4)');
    for (let k = 1; k < 3; k++) fr(c, wx + k * ww / 3, y + 22, 1, 24, 'rgba(60,80,90,.3)');
    sr(c, wx, y + 22, ww, 24, 'rgba(40,30,20,.35)', 1);
  }
  // 大铁门
  const dw = Math.min(96, w * .38), dx = x + w / 2 - dw / 2, dy = y + h - 12 - 40;
  fr(c, dx, dy, dw, 40, '#7c7266');
  fr(c, dx, dy, dw, 3, 'rgba(255,255,255,.16)');
  for (let i = 1; i < 4; i++) fr(c, dx + i * dw / 4, dy, 1, 40, 'rgba(0,0,0,.20)');
  fr(c, dx + dw / 2 - 1, dy, 2, 40, 'rgba(0,0,0,.3)');
  sr(c, dx, dy, dw, 40, 'rgba(30,20,12,.5)', 1);
  sr(c, x, y + 6, w, h - 6, 'rgba(45,30,20,.42)', 2);
}

  const st = p.style, x = p.x, y = p.y, w = p.w, h = p.h;
  const pal = {
    wood:   { p:'#8a6a44', p2:'#6d5132', beam:'#7a5a38', plate:'#e8d6b0', tx:'#5b2a14' },
    brick:  { p:'#a35c44', p2:'#84452f', beam:'#8a4a35', plate:'#f2e3c6', tx:'#5b2a14' },
    iron:   { p:'#7d7a72', p2:'#64615a', beam:'#6e6b63', plate:'#d9d2c0', tx:'#3a2a1c' },
    stone:  { p:'#cdc6b6', p2:'#b3ab9a', beam:'#bdb5a4', plate:'#faf3e3', tx:'#5b2a14' },
    modern: { p:'#c9d8de', p2:'#a7bcc5', beam:'#8fa9b4', plate:'#8a0d22', tx:'#f7e6c8' }
  }[st] || { p:'#a35c44', p2:'#84452f', beam:'#8a4a35', plate:'#f2e3c6', tx:'#5b2a14' };

  sh(c, x + w / 2, y + h + 2, w * .5, 8, .18);
  const pw = 26, ph = h;
  // 门柱
  [x, x + w - pw].forEach(px => {
    fr(c, px, y + 8, pw, ph, pal.p);
    fr(c, px + pw - 7, y + 8, 7, ph, pal.p2);
    fr(c, px, y + 8, pw, 3, 'rgba(255,255,255,.22)');
    sr(c, px, y + 8, pw, ph, 'rgba(38,26,16,.45)', 1.5);
  });
  // 横梁
  fr(c, x + pw - 3, y + 8, w - pw * 2 + 6, 22, pal.beam);
  fr(c, x + pw - 3, y + 8, w - pw * 2 + 6, 4, 'rgba(255,255,255,.18)');
  sr(c, x + pw - 3, y + 8, w - pw * 2 + 6, 22, 'rgba(38,26,16,.45)', 1.5);

  // 匾额
  const lw = Math.min(w - 26, 246), lx = x + w / 2 - lw / 2, ly = y - 4, lh = 32;
  fr(c, lx, ly, lw, lh, pal.plate);
  sr(c, lx, ly, lw, lh, st === 'modern' ? '#e3b465' : 'rgba(70,40,20,.45)', 1.5);
  const label = p.label || '';
  let fs = 18;
  c.font = 'bold ' + fs + 'px ' + FONT_S;
  while (c.measureText(label).width > lw - 20 && fs > 8){ fs -= 1; c.font = 'bold ' + fs + 'px ' + FONT_S; }
  c.fillStyle = pal.tx; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(label, x + w / 2, ly + lh / 2 + 1);

  // 门扇（半开）
  fr(c, x + pw - 2, y + 34, 14, h - 30, pal.p2);
  fr(c, x + w - pw - 12, y + 34, 14, h - 30, pal.p2);
  // 门柱灯笼（现代/校庆）
  if (st === 'modern'){
    [x + 4, x + w - 22].forEach(px => {
      fr(c, px + 3, y + 38, 12, 3, '#8a6a2a');
      c.fillStyle = '#c8202f'; c.beginPath(); c.ellipse(px + 9, y + 52, 9, 12, 0, 0, 6.2832); c.fill();
      fr(c, px + 1, y + 50, 16, 2, '#e3b465');
      fr(c, px + 8, y + 62, 2, 6, '#e3b465');
    });
  }
}

/* ---------------- 记忆碎片 ---------------- */
function drawMemory(c, p, t){
  const bob = Math.sin(t * 2.2 + p.x * .02) * 5;
  const x = p.x, y = p.y - 26 + bob;
  const pulse = .5 + Math.sin(t * 2.2 + p.x * .02) * .18;

  // 光晕
  const g = c.createRadialGradient(x, y, 3, x, y, 40);
  g.addColorStop(0, 'rgba(255,226,150,' + (.42 * pulse + .12) + ')');
  g.addColorStop(1, 'rgba(255,226,150,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 40, 0, 6.2832); c.fill();

  if (p.got){
    c.save(); c.globalAlpha = .22;
    c.strokeStyle = '#e3b465'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(x, y, 15, 0, 6.2832); c.stroke();
    c.restore();
    return;
  }

  // 地面光环
  c.save();
  c.strokeStyle = 'rgba(227,180,101,' + (.35 + pulse * .35) + ')'; c.lineWidth = 2;
  c.beginPath(); c.ellipse(p.x, p.y - 2, 17 + pulse * 3, 6 + pulse, 0, 0, 6.2832); c.stroke();
  c.restore();

  // 菱形碎片
  c.save(); c.translate(x, y); c.rotate(Math.sin(t * 1.1 + p.x) * .12);
  c.beginPath();
  c.moveTo(0, -15); c.lineTo(11, 0); c.lineTo(0, 15); c.lineTo(-11, 0); c.closePath();
  const gg = c.createLinearGradient(-11, -15, 11, 15);
  gg.addColorStop(0, '#fff8e0'); gg.addColorStop(.5, '#f0c675'); gg.addColorStop(1, '#c99a45');
  c.fillStyle = gg; c.fill();
  c.strokeStyle = '#fff8e0'; c.lineWidth = 1.5; c.stroke();
  c.restore();

  c.save(); c.globalAlpha = .8;
  circle(c, x - 3, y - 5, 2.4, '#fffdf2');
  c.restore();

  // 提示标签（放在碎片下方，避免压住建筑）
  const label = p.hint || '';
  if (label){
    c.font = '11px ' + FONT_H;
    const tw = c.measureText(label).width;
    const ly = p.y + 4;
    fr(c, p.x - tw / 2 - 7, ly, tw + 14, 17, 'rgba(26,13,16,.62)');
    sr(c, p.x - tw / 2 - 7, ly, tw + 14, 17, 'rgba(227,180,101,.28)', 1);
    c.fillStyle = '#f0dcb4'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, p.x, ly + 9);
  }
}

/* ---------------- 主角 ---------------- */
function drawPlayer(c, p, t){
  const x = p.x, y = p.y;
  sh(c, x, y, 13, 5, .22, 'rgba(30,18,10,.28)');
  const walk = p.moving ? Math.sin(p.anim * 11) : 0;
  const bob = p.moving ? Math.abs(Math.sin(p.anim * 11)) * 1.8 : Math.sin(t * 1.6) * .5;
  const by = y - bob;
  const dir = p.dir;

  // 腿
  const lh = 13, lw = 7;
  const lx = x - 8, rx = x + 1;
  fr(c, lx + (walk > 0 ? 1 : 0), by - lh + (walk > 0 ? -2 : 0), lw, lh, '#333a48');
  fr(c, rx - (walk > 0 ? 1 : 0), by - lh + (walk > 0 ? 0 : -2), lw, lh, '#2b313d');
  // 鞋
  fr(c, lx + (walk > 0 ? 1 : 0), by - 3, lw + 1, 3, '#1d222b');
  fr(c, rx - (walk > 0 ? 1 : 0), by - 3, lw + 1, 3, '#1d222b');

  // 身体
  const bw = 20, bh = 18, bx = x - bw / 2, byy = by - lh - bh + 1;
  fr(c, bx, byy, bw, bh, '#b8283f');
  fr(c, bx, byy, bw, 4, '#cf3a51');
  fr(c, bx + bw - 5, byy, 5, bh, '#9c1f34');
  // 白色斜纹（校庆卫衣）
  fr(c, bx + 3, byy + 7, bw - 6, 2, 'rgba(255,255,255,.72)');
  fr(c, bx + 7, byy, 6, 4, '#f2e6d0');
  // 手臂
  fr(c, bx - 4, byy + 3 + walk * 2, 5, 12, '#a32036');
  fr(c, bx + bw - 1, byy + 3 - walk * 2, 5, 12, '#8e1b2e');

  // 头
  const hy = byy - 10;
  fr(c, x - 9, hy, 18, 17, '#f0c9a0');
  fr(c, x - 9, hy, 18, 3, '#e0b48a');
  // 头发
  fr(c, x - 10, hy - 4, 20, 8, '#2b2118');
  if (dir === 'up'){
    fr(c, x - 9, hy + 2, 18, 8, '#2b2118');
  } else if (dir === 'down'){
    fr(c, x - 10, hy - 5, 20, 7, '#2b2118');
    fr(c, x - 10, hy - 5, 20, 2, '#3a2c20');
    fr(c, x - 6, hy + 5, 3, 3, '#2b2118');
    fr(c, x + 3, hy + 5, 3, 3, '#2b2118');
    fr(c, x - 2, hy + 10, 4, 1.5, '#c98f6a');
  } else if (dir === 'left'){
    fr(c, x - 10, hy - 5, 20, 6, '#2b2118');
    fr(c, x - 10, hy - 2, 5, 12, '#2b2118');
    fr(c, x - 8, hy + 5, 3, 3, '#2b2118');
  } else {
    fr(c, x - 10, hy - 5, 20, 6, '#2b2118');
    fr(c, x + 5, hy - 2, 5, 12, '#2b2118');
    fr(c, x + 5, hy + 5, 3, 3, '#2b2118');
  }
  // 围巾（校庆红）
  fr(c, x - 8, byy - 2, 16, 3, '#e3b465');
}

/* ---------------- 交互提示 ---------------- */
function drawPrompt(c, x, y, text){
  c.font = 'bold 12px ' + FONT_H;
  const tw = c.measureText(text).width;
  const w = tw + 26, h = 24, bx = x - w / 2, by = y;
  c.fillStyle = 'rgba(26,13,16,.85)';
  c.beginPath();
  if (c.roundRect) c.roundRect(bx, by, w, h, 6); else c.rect(bx, by, w, h);
  c.fill();
  c.strokeStyle = 'rgba(227,180,101,.7)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#f7e2b2'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, x, by + h / 2 + 1);
}

   七秩·杭电时光 —— 引擎：状态机 / 输入 / 碰撞 / 渲染 / 音效
   ========================================================= */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DPR = 2;

const SPEED = 168;
const P_HIT = { w: 20, h: 20 };   // 脚下碰撞盒

const Game = {
  state: 'title',        // title | intro | play | dialog | quiz | clear | ending
  chIndex: 0,
  scene: null,
  time: 0,
  keys: {},
  player: { x: 480, y: 540, dir: 'down', moving: false, anim: 0 },
  stats: { cards: 0, right: 0, wrong: 0, playSeconds: 0 },
  particles: [],
  fireworks: [],
  progress: { unlocked: 1, cleared: [], got: {}, bless: '', name: '' },
  sfxOn: true,
  bgmOn: true,
  started: false
};

/* ---------- 伪随机 ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 碰撞体定义 ---------- */
const PROP_DEF = {
  gate:     { base: p => p.y + p.h,
              solid: p => [[p.x + 2, p.y + 6, 26, p.h], [p.x + p.w - 28, p.y + 6, 26, p.h]] },
  hall:     { base: p => p.y + p.h, solid: p => [[p.x, p.y - 12, p.w, p.h + 12]] },
  library:  { base: p => p.y + p.h, solid: p => [[p.x, p.y - 16, p.w, p.h + 16]] },
  workshop: { base: p => p.y + p.h, solid: p => [[p.x, p.y - 16, p.w, p.h + 16]] },
  screen:   { base: p => p.y + p.h, solid: p => [[p.x, p.y, p.w, p.h]] },
  stage:    { base: p => p.y + p.h, solid: p => [[p.x, p.y + 10, p.w, p.h - 10]] },
  board:    { base: p => p.y + p.h, solid: p => [[p.x, p.y - 5, p.w, p.h + 5]] },
  crate:    { base: p => p.y + 36,  solid: p => [[p.x, p.y, 36, 36]] },
  bench:    { base: p => p.y + 16,  solid: p => [[p.x, p.y, 66, 18]] },
  statue:   { base: p => p.y + 2,   solid: p => [[p.x - 26, p.y - 16, 52, 20]] },
  pond:     { base: p => p.y + p.h, solid: p => [[p.x + 12, p.y + 12, p.w - 24, p.h - 24]] },
  tree:     { base: p => p.y,       solid: p => [[p.x - 9, p.y - 13, 18, 13]] },
  flag:     { base: p => p.y,       solid: p => [[p.x - 7, p.y - 8, 14, 8]] },
  lamp:     { base: p => p.y,       solid: p => [[p.x - 6, p.y - 8, 12, 8]] },
  banner:   { base: p => p.y,       solid: p => [[p.x - 3, p.y - 12, 9, 12]] },
  wall:     { base: p => p.y + p.h, solid: p => [[p.x, p.y, p.w, p.h]] }

/* ---------- 构建场景 ---------- */
function buildScene(i){
  const ch = CHAPTERS[i];
  const rnd = mulberry32(9173 + i * 6151);
  const inPath = (x, y) => ch.paths.some(p => x > p.x - 6 && x < p.x + p.w + 6 && y > p.y - 6 && y < p.y + p.h + 6);

  const decals = { big: [], small: [] };
  for (let k = 0; k < 26; k++){
    decals.big.push({
      x: rnd() * 1040 - 60, y: rnd() * 660 - 40,
      w: 110 + rnd() * 200, h: 80 + rnd() * 130
    });
  }
  const decor = GROUNDS[ch.ground].decor;
  let guard = 0;
  while (decals.small.length < 150 && guard++ < 3000){
    const x = 6 + rnd() * 948, y = 50 + rnd() * 544;
    if (inPath(x, y)) continue;
    let t = 0;
    if (decor === 'tuft') t = 1;
    else if (decor === 'brick' || decor === 'tile') t = 2;
    else if (decor === 'leaf' || decor === 'pebble') t = rnd() < .5 ? 0 : 3;
    else t = rnd() < .4 ? 1 : 0;
    decals.small.push({ x, y, t, s: t === 2 ? 12 + rnd() * 22 : 1 + rnd() * 2.4, c: '#ffffff' });
  }

  const props = [], solids = [], mems = [];
  let gate = null;
  ch.props.forEach(src => {
    const p = Object.assign({}, src);
    if (p.t === 'mem'){
      p.got = false;
      p.baseY = p.y;
      mems.push(p);
      props.push(p);
      return;
    }
    const def = PROP_DEF[p.t];
    p.baseY = def ? def.base(p) : p.y + (p.h || 0);
    if (def) def.solid(p).forEach(s => solids.push(s));
    if (p.t === 'gate') gate = p;
    props.push(p);
  });

  return { ch, chIndex: i, decals, props, solids, mems, gate, allGot: false };
}

/* ---------- 场景切换 ---------- */
function enterChapter(i){
  Game.chIndex = i;
  Game.scene = buildScene(i);
  const s = Game.scene.ch.start;
  Game.player.x = s.x; Game.player.y = s.y;
  Game.player.dir = 'up'; Game.player.anim = 0; Game.player.moving = false;
  spawnAmbient(Game.scene);
  Game.state = 'intro';
  UI.showIntro(i);
}

/* ---------- 粒子 ---------- */
function spawnAmbient(sc){
  const conf = sc.ch.ambient;
  Game.particles = [];
  for (let k = 0; k < conf.n; k++) Game.particles.push(newAmbient(conf, true));
}
function newAmbient(conf, anywhere){
  const t = conf.type;
  const p = {
    x: Math.random() * VW,
    y: anywhere ? Math.random() * VH : (t === 'pollen' ? VH + 10 : -10),
    ph: Math.random() * 6.28,
    s: t === 'confetti' ? 3 + Math.random() * 3 : 1 + Math.random() * 1.8,
    col: conf.color,
    rot: Math.random() * 6.28,
    vr: (Math.random() - .5) * 2,
    type: t
  };
  if (t === 'dust')      { p.vx = 6 + Math.random() * 8; p.vy = -3 - Math.random() * 4; }
  else if (t === 'leaf') { p.vx = -6 - Math.random() * 10; p.vy = 16 + Math.random() * 12; }
  else if (t === 'pollen'){ p.vx = (Math.random() - .5) * 10; p.vy = -8 - Math.random() * 8; }
  else                   { p.vx = (Math.random() - .5) * 16; p.vy = 16 + Math.random() * 14; }
  return p;
}
function updateParticles(dt){
  if (!Game.scene) return;
  const conf = Game.scene.ch.ambient;
  Game.particles.forEach((p, i) => {
    p.ph += dt * 2;
    p.x += (p.vx + Math.sin(p.ph) * 6) * dt;
    p.y += p.vy * dt;
    if (p.type === 'confetti') p.rot += p.vr * dt;
    if (p.y < -20 || p.y > VH + 20 || p.x < -20 || p.x > VW + 20){
      Game.particles[i] = newAmbient(conf, false);
    }
  });
}
function drawParticles(){
  Game.particles.forEach(p => {
    ctx.save();
    if (p.type === 'confetti'){
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = [p.col, '#e3b465', '#f2e6cc'][Math.floor(p.s * 3) % 3];
      ctx.fillRect(-p.s, -p.s * .6, p.s * 2, p.s * 1.2);
    } else if (p.type === 'leaf'){
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.globalAlpha = .75;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s * 2.6, p.s, 0, 0, 6.2832); ctx.fill();
    } else {
      ctx.fillStyle = p.col;
      ctx.globalAlpha = p.type === 'dust' ? .55 : .7;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  });
}

/* ---------- 烟花 ---------- */
const FW_COLORS = ['#ffd67a', '#ff7a8a', '#fff3d0', '#ffb347', '#ff5d6c', '#a8e6ff'];
function burst(x, y){
  const col = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
  const n = 34 + Math.floor(Math.random() * 16);
  for (let i = 0; i < n; i++){
    const a = (i / n) * 6.2832 + Math.random() * .2;
    const sp = 40 + Math.random() * 120;
    Game.fireworks.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1.1 + Math.random() * .8, age: 0, col, r: 1.9 + Math.random() * 1.8
    });
  }
}
function updateFireworks(dt){
  Game.fireworks.forEach(p => {
    p.age += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 46 * dt; p.vx *= (1 - 1.1 * dt); p.vy *= (1 - 1.1 * dt);
  });
  Game.fireworks = Game.fireworks.filter(p => p.age < p.life);
}

/* ---------- 音效 ---------- */
const SFX = {
  ac: null,
  broken: false,
  ensure(){
    if (this.broken) return null;
    try{
      if (!this.ac){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC){ this.broken = true; return null; }
        this.ac = new AC();
      }
      if (this.ac.state === 'suspended') this.ac.resume();
      return this.ac;
    } catch (e){ this.broken = true; return null; }
  },
  tone(freq, dur, type, vol, delay){
    if (!Game.sfxOn) return;
    try{
      const ac = this.ensure(); if (!ac) return;
      const t0 = ac.currentTime + (delay || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol || .07, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + .02);
    } catch (e){ /* 无音频设备时静默降级 */ }
  },
  pick(){ [880, 1174, 1568].forEach((f, i) => this.tone(f, .22, 'triangle', .06, i * .055)); },
  open(){ this.tone(520, .10, 'sine', .04); },
  next(){ this.tone(680, .09, 'sine', .035); },
  right(){ [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .3, 'triangle', .07, i * .09)); },
  wrong(){ this.tone(180, .22, 'sawtooth', .05); this.tone(140, .28, 'sawtooth', .05, .1); },
  gate(){ [392, 523, 659, 784].forEach((f, i) => this.tone(f, .5, 'sine', .05, i * .1)); },
  clear(){ [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, .45, 'triangle', .06, i * .1)); }
};

/* ---------- BGM ---------- */
const BGM = {
  timer: null, step: 0,
  seq: [523.25, 659.25, 783.99, 880, 783.99, 659.25, 587.33, 523.25,
        523.25, 587.33, 659.25, 783.99, 880, 783.99, 659.25, 587.33],
  start(){
    if (this.timer || !Game.bgmOn) return;
    const ac = SFX.ensure(); if (!ac) return;
    this.timer = setInterval(() => {
      if (!Game.bgmOn || !Game.started) return;
      const f = this.seq[this.step % this.seq.length];
      this.step++;
      const ac2 = SFX.ensure(); if (!ac2) return;
      const t0 = ac2.currentTime;
      const o = ac2.createOscillator(), g = ac2.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(.022, t0 + .25);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.7);
      o.connect(g); g.connect(ac2.destination);
      o.start(t0); o.stop(t0 + 1.8);
    }, 1600);
  },
  stop(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }
};

/* ---------- 输入 ---------- */
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right'
};

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();

  if (Game.state === 'dialog'){
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E') UI.advanceDialog();
    return;
  }
  if (Game.state === 'quiz'){
    if (/^[1-4]$/.test(e.key)) UI.pickOption(+e.key - 1);
    return;
  }
  if (Game.state === 'intro'){
    if (e.key === ' ' || e.key === 'Enter') UI.beginPlay();
    return;
  }
  if (Game.state === 'play'){
    if (KEYMAP[e.key]){ Game.keys[KEYMAP[e.key]] = true; return; }
    if (e.key === 'e' || e.key === 'E' || e.key === ' ' || e.key === 'Enter'){ tryInteract(); }
  }
});
window.addEventListener('keyup', e => {
  if (KEYMAP[e.key]) Game.keys[KEYMAP[e.key]] = false;
});
window.addEventListener('blur', () => { Game.keys = {}; });

/* ---------- 移动 ---------- */
function hitRect(x, y){
  // 玩家脚下碰撞盒
  return [x - P_HIT.w / 2, y - P_HIT.h, P_HIT.w, P_HIT.h];
}
function blocked(nx, ny, solids){
  const b = hitRect(nx, ny);
  for (let i = 0; i < solids.length; i++){
    const s = solids[i];
    if (b[0] < s[0] + s[2] && b[0] + b[2] > s[0] && b[1] < s[1] + s[3] && b[1] + b[3] > s[1]) return true;
  }
  return false;
}
function updatePlayer(dt){
  const k = Game.keys;
  let dx = 0, dy = 0;
  if (k.left) dx -= 1;
  if (k.right) dx += 1;
  if (k.up) dy -= 1;
  if (k.down) dy += 1;

  const p = Game.player;
  p.moving = !!(dx || dy);
  if (p.moving){
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? 'right' : 'left';
    else p.dir = dy > 0 ? 'down' : 'up';

    const solids = Game.scene.solids;
    const x0 = p.x, y0 = p.y;
    const nx = x0 + dx * SPEED * dt;
    const ny = y0 + dy * SPEED * dt;
    if (!blocked(nx, y0, solids)) p.x = nx;
    if (!blocked(p.x, ny, solids)) p.y = ny;
    p.x = Math.max(16, Math.min(VW - 16, p.x));
    p.y = Math.max(150, Math.min(VH - 8, p.y));
    p.anim += dt;
  } else {
    p.anim = 0;
  }
}

/* ---------- 交互 ---------- */
function nearestMem(){
  if (!Game.scene) return null;
  let best = null, bd = 56;
  Game.scene.mems.forEach(m => {
    if (m.got) return;
    const d = Math.hypot(m.x - Game.player.x, (m.y - 26) - (Game.player.y - 16));
    if (d < bd){ bd = d; best = m; }
  });
  return best;
}
function nearGate(){
  const g = Game.scene && Game.scene.gate;
  if (!g) return false;
  const cx = g.x + g.w / 2, cy = g.y + g.h;
  return Math.hypot(cx - Game.player.x, cy - Game.player.y) < 108;
}
function gotCount(){ return Game.scene.mems.filter(m => m.got).length; }
function needCount(){ return Game.scene ? Game.scene.mems.length : 3; }

function tryInteract(){
  const m = nearestMem();
  if (m){
    m.got = true;
    Game.stats.cards++;
    Game.state = 'dialog';
    UI.updateHUD();
    UI.floatText(m.x, m.y - 60, '记忆碎片 +1');
    UI.openCard(Game.scene.ch, m.card);
    checkAllGot();
    SFX.pick();
    return;
  }
  if (nearGate()){
    if (gotCount() >= needCount()){
      SFX.gate();
      Game.state = 'quiz';
      UI.openQuiz(Game.scene.ch);
    } else {
      UI.toast('还差 ' + (needCount() - gotCount()) + ' 片，先在校园里转转吧');
    }
    return;
  }
  UI.toast('这里没有可互动的东西');
}

function checkAllGot(){
  if (!Game.scene) return;
  if (gotCount() >= needCount() && !Game.scene.allGot){
    Game.scene.allGot = true;
    setTimeout(() => UI.toast('记忆集齐了，回校门答题吧'), 900);
  }
}

/* ---------- 章节推进 ---------- */
function onQuizCorrect(){
  Game.stats.right++;
  UI.updateHUD();
  Game.state = 'clear';
}
function onQuizWrong(){ Game.stats.wrong++; UI.updateHUD(); }

function nextChapter(){
  const next = Game.chIndex + 1;
  if (next >= CHAPTERS.length){ startEnding(); return; }
  enterChapter(next);
}

/* ---------- 结局 ---------- */
let fwTimer = 0;
function startEnding(){
  Game.state = 'ending';
  Game.fireworks = [];
  UI.showEnding();
}
function renderNight(t, dt){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0b0812');
  g.addColorStop(.45, '#1e0d18');
  g.addColorStop(.78, '#3a1521');
  g.addColorStop(1, '#4a1a25');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  // 月
  ctx.save();
  const mg = ctx.createRadialGradient(786, 100, 10, 786, 100, 120);
  mg.addColorStop(0, 'rgba(255,242,210,.50)'); mg.addColorStop(.45, 'rgba(255,236,190,.14)');
  mg.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(786, 100, 120, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#fdf3d8'; ctx.beginPath(); ctx.arc(786, 100, 27, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(214,198,160,.45)';
  ctx.beginPath(); ctx.arc(777, 92, 6, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(795, 108, 4.5, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(790, 88, 3, 0, 6.2832); ctx.fill();
  ctx.restore();

  // 校园剪影（带窗光）
  const rnd = mulberry32(4242);
  const blds = [];
  for (let i = 0; i < 14; i++){
    const w = 52 + rnd() * 76, h = 42 + rnd() * 78;
    blds.push({ x: i * 70 - 16, y: 478 - h, w: w, h: h });
  }
  blds.push({ x: 338, y: 296, w: 154, h: 182 });
  blds.push({ x: 648, y: 330, w: 126, h: 148 });
  blds.sort((a, b) => a.y - b.y);
  blds.forEach(b => {
    ctx.fillStyle = '#1c0f17';
    ctx.fillRect(b.x, b.y, b.w, b.h + 126);
    ctx.fillStyle = 'rgba(150,80,100,.30)';
    ctx.fillRect(b.x, b.y, b.w, 2);
    const cols = Math.max(1, Math.floor(b.w / 17));
    const rows = Math.max(1, Math.floor(b.h / 21));
    for (let cx2 = 0; cx2 < cols; cx2++){
      for (let ry = 0; ry < rows; ry++){
        if (rnd() < .5) continue;
        ctx.fillStyle = rnd() < .78 ? 'rgba(255,206,128,.80)' : 'rgba(255,206,128,.26)';
        ctx.fillRect(b.x + 7 + cx2 * 17, b.y + 11 + ry * 21, 7, 9);
      }
    }
  });
  // 主楼塔尖
  ctx.fillStyle = '#1c0f17';
  ctx.beginPath(); ctx.moveTo(415, 250); ctx.lineTo(392, 296); ctx.lineTo(438, 296); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,206,128,.55)';
  ctx.fillRect(413, 274, 4, 12);

  // 地面
  ctx.fillStyle = '#2b1019';
  ctx.fillRect(0, 478, VW, 122);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(0, 478, VW, 6);
  const gg = ctx.createRadialGradient(480, 560, 20, 480, 560, 420);
  gg.addColorStop(0, 'rgba(214,60,80,.22)'); gg.addColorStop(1, 'rgba(214,60,80,0)');
  ctx.fillStyle = gg; ctx.fillRect(0, 478, VW, 122);

  // 烟花
  fwTimer -= dt;
  if (fwTimer <= 0){
    fwTimer = .45 + Math.random() * .6;
    burst(140 + Math.random() * 680, 60 + Math.random() * 150);
  }
  ctx.save();
  Game.fireworks.forEach(p => {
    const a = Math.max(0, 1 - p.age / p.life);
    ctx.globalAlpha = a * a * .95;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + a * .8), 0, 6.2832); ctx.fill();
  });
  ctx.restore();
}

/* ---------- 标题背景 ---------- */
function renderTitleBg(t){
  const g = ctx.createRadialGradient(480, 300, 60, 480, 300, 560);
  g.addColorStop(0, '#5a1522'); g.addColorStop(.55, '#33101a'); g.addColorStop(1, '#170a10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  // 光晕
  const hg = ctx.createRadialGradient(480, 250, 10, 480, 250, 380);
  hg.addColorStop(0, 'rgba(227,180,101,.20)'); hg.addColorStop(1, 'rgba(227,180,101,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, VW, VH);

  // 剪影校园
  const rnd = mulberry32(1234);
  ctx.fillStyle = 'rgba(14,6,10,.55)';
  for (let i = 0; i < 18; i++){
    const w = 44 + rnd() * 100, h = 40 + rnd() * 80;
    ctx.fillRect(i * 56 - 20, 520 - h, w, h + 100);
  }
  ctx.fillStyle = 'rgba(14,6,10,.55)';
  ctx.fillRect(370, 340, 130, 260);
  ctx.fillRect(410, 300, 40, 45);

  // 漂浮金尘
  for (let i = 0; i < 46; i++){
    const seed = i * 97.13;
    const x = (seed * 7.31 + Math.sin(t * .32 + i) * 34) % VW;
    const y = (620 - ((t * (7 + i % 9) + seed * 3.7) % 700));
    const a = .16 + .22 * Math.abs(Math.sin(t * .8 + i));
    ctx.fillStyle = 'rgba(247,224,176,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, .9 + (i % 3) * .7, 0, 6.2832); ctx.fill();
  }
}

/* ---------- 主渲染 ---------- */
function renderWorld(){
  const sc = Game.scene;
  drawGround(ctx, sc.ch, sc.decals);

  // 时光之门光柱
  if (sc.allGot && sc.gate){
    const gx = sc.gate.x + sc.gate.w / 2, gy = sc.gate.y + sc.gate.h;
    const pulse = .5 + Math.sin(Game.time * 2) * .2;
    const gg = ctx.createRadialGradient(gx, gy - 20, 4, gx, gy - 20, 96);
    gg.addColorStop(0, 'rgba(255,226,150,' + (.30 * pulse + .12) + ')');
    gg.addColorStop(1, 'rgba(255,226,150,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.ellipse(gx, gy - 20, 96, 70, 0, 0, 6.2832); ctx.fill();
  }

  // 深度排序
  const list = sc.props.slice();
  list.push({
    t: '__player', baseY: Game.player.y, x: Game.player.x, y: Game.player.y
  });
  list.sort((a, b) => a.baseY - b.baseY);

  list.forEach(e => {
    if (e.t === '__player'){
      if (Game.state !== 'title' && Game.state !== 'ending') drawPlayer(ctx, Game.player, Game.time);
      return;
    }
    if (e.t === 'mem') return;         // 碎片单独绘制，始终在上层
    const fn = ART[e.t];
    if (fn) fn(ctx, e);
  });

  sc.mems.forEach(m => drawMemory(ctx, m, Game.time + m.x * .01));

  // 氛围粒子
  drawParticles();

  // 交互提示
  if (Game.state === 'play'){
    const m = nearestMem();
    if (m) drawPrompt(ctx, m.x, m.y - 62, 'E  查看');
    else if (nearGate()){
      const all = gotCount() >= needCount();
      drawPrompt(ctx, sc.gate.x + sc.gate.w / 2, sc.gate.y + sc.gate.h + 12,
        all ? 'E  开启时光之门' : '还差 ' + (needCount() - gotCount()) + ' 片');
    }
  }

  // 天色
  if (sc.ch.sky){ ctx.fillStyle = sc.ch.sky; ctx.fillRect(0, 0, VW, VH); }

  // 暗角
  const vg = ctx.createRadialGradient(480, 300, 260, 480, 300, 560);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(20,10,6,.34)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
}

let lastTs = 0;
function loop(ts){
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  dt = Math.min(dt, .05);
  Game.time += dt;

  if (Game.state === 'play'){
    updatePlayer(dt);
    Game.stats.playSeconds += dt;
    updateParticles(dt);
  } else if (Game.state === 'ending'){
    updateFireworks(dt);
  } else if (Game.state === 'dialog' || Game.state === 'intro'){
    updateParticles(dt);
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);

  if (Game.state === 'title'){
    renderTitleBg(Game.time);
  } else if (Game.state === 'ending'){
    renderNight(Game.time, dt);
  } else if (Game.scene){
    renderWorld();
  }

  requestAnimationFrame(loop);
}

/* ---------- 启动 ---------- */
function boot(){
  cv.width = VW * DPR; cv.height = VH * DPR;
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  UI.init();
  UI.fit();
  window.addEventListener('resize', UI.fit);
  requestAnimationFrame(loop);
}

        bless: Game.progress.bless,

        sound: Game.sfxOn
      }));

  },
  load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;

      Game.progress.unlocked = d.unlocked || 1;
      Game.progress.cleared = d.cleared || [];
      Game.progress.got = d.got || {};      Game.progress.bless = d.bless || '';
      Game.progress.name = d.name || '';
      Game.stats.right = d.right || 0;
      Game.stats.wrong = d.wrong || 0;
      Game.stats.playSeconds = d.sec || 0;
      if (d.sound === false){ Game.sfxOn = false; Game.bgmOn = false; }

  openQuiz(ch){
    this.quizCh = ch;

    show(this.hud, true);
    show(this.hintbar, false);
    show(this.quizWrap, true);
    this.quizWrap.querySelector('#qQ').textContent = q.q;

    if (this.answered) return;
    const q = this.quizCh.quiz;

    const fb = this.quizWrap.querySelector('#qFb');
    if (i === q.a){
      this.answered = true;
      opts[i].classList.add('right');
      opts.forEach(o => o.classList.add('disabled'));
      fb.textContent = '✓ ' + q.why;

      foot.querySelector('#qNext').onclick = () => this.confirmQuizRight();

      SFX.wrong();
      onQuizWrong();
      fb.textContent = '再想一想 —— 线索就在你刚才读过的记忆碎片里。';

      setTimeout(() => {
        opts[i].classList.remove('wrong');
        if (!this.answered) fb.classList.remove('show');
      }, 1400);
    }
  },
  confirmQuizRight(){
    if (!this.answered) return;
    show(this.quizWrap, false);
    show(this.hintbar, true);
    const i = Game.chIndex;
    onQuizCorrect();
    Game.progress.cleared = Game.progress.cleared.filter(x => x !== i).concat(i);
    Game.progress.unlocked = Math.max(Game.progress.unlocked, Math.min(i + 2, CHAPTERS.length));
    this.showClear(i);
  },

  /* ---------------- 通关 ---------------- */
  showClear(i){
    const ch = CHAPTERS[i];
    this.save();
    const sec = Math.round(Game.stats.playSeconds);
    const mm = String(Math.floor(sec / 60)).padStart(2, '0');
    const ss = String(sec % 60).padStart(2, '0');
    show(this.hud, false); show(this.hintbar, false);
    SFX.clear();
    const last = i === CHAPTERS.length - 1;
    this.setScreen(
      '<div class="clear">' +
      '<div class="lab">第 ' + (i + 1) + ' 章 · 已完成</div>' +
      '<div class="big">' + ch.year + '</div>' +
      '<div class="row">' +
      '<div class="cell"><b>' + ch.cards.length + '/' + ch.cards.length + '</b><span>记忆碎片</span></div>' +
      '<div class="cell"><b>' + Game.stats.right + '</b><span>问答答对</span></div>' +
      '<div class="cell"><b>' + mm + ':' + ss + '</b><span>本局用时</span></div>' +
      '</div>' +
      '<div class="quote">「' + ch.tagline + '」</div>' +
      '<div style="margin-top:24px"><button class="btn" id="cNext">' +
      (last ? '走向七十周年' : '进入下一章 ▸') + '</button></div></div>', 'clear-wrap');
    this.screen.querySelector('#cNext').onclick = () => {
      this.setScreen('', '');
      nextChapter();
    };
  },

  /* ---------------- 结局 ---------------- */
  showEnding(){
    const got = Object.keys(Game.progress.got).length;
    const total = totalCards();
    const sec = Math.round(Game.stats.playSeconds);
    const mm = Math.floor(sec / 60), ss = sec % 60;
    const acc = Game.stats.right + Game.stats.wrong > 0
      ? Math.round(Game.stats.right / (Game.stats.right + Game.stats.wrong) * 100) : 100;

    show(this.hud, false); show(this.hintbar, false);
    show(this.dlg, false); show(this.quizWrap, false);

    let mean = '';
    MOTTO.forEach(m => { mean += '<div><b>' + m.w + '</b>' + m.d + '</div>'; });

    this.setScreen(
      '<div class="ending">' +
      '<div class="end-crest">杭 州 电 子 科 技 大 学 · 一 九 五 六 — 二 〇 二 六</div>' +
      '<div class="end-motto">笃学力行　守正求新</div>' +
      '<div class="end-mean">' + mean + '</div>' +
      '<div class="end-line">精 神 基 因　<em>国家大事　千万尽力</em></div>' +
      '<div class="end-line" style="margin-top:6px;animation-delay:1.75s">优 良 传 统　<em>团结勤奋　求实创新</em></div>' +
      '<div class="end-stats">' +
      '<div class="cell"><b>' + got + '/' + total + '</b><span>记忆碎片</span></div>' +
      '<div class="cell"><b>' + acc + '%</b><span>校史问答正确率</span></div>' +
      '<div class="cell"><b>' + mm + '′' + String(ss).padStart(2, '0') + '″</b><span>穿越用时</span></div>' +
      '</div>' +
      '<div class="end-bless"><input id="blessInput" maxlength="34" placeholder="写一句给母校的祝福，会印在你的记忆卡上"></div>' +
      '<div class="end-btns">' +
      '<button class="btn sm" id="eCard">生成我的七秩记忆卡</button>' +
      '<button class="btn ghost" id="eBag">翻看记忆墙</button>' +
      '<button class="btn ghost" id="eSrc">史料来源</button>' +
      '<button class="btn ghost" id="eNote">作者手记</button>' +
      '<button class="btn ghost" id="eAgain">重走七秩</button>' +
      '</div></div>', 'ending-wrap');

    const input = this.screen.querySelector('#blessInput');
    input.value = Game.progress.bless || '';
    input.oninput = () => { Game.progress.bless = input.value; this.save(); };

    this.screen.querySelector('#eCard').onclick = () => this.exportCard();
    this.screen.querySelector('#eBag').onclick = () => this.openBag();
    this.screen.querySelector('#eSrc').onclick = () => this.openSources();
    this.screen.querySelector('#eNote').onclick = () => this.openAuthorNote();
    this.screen.querySelector('#eAgain').onclick = () => {
      Game.stats.playSeconds = 0; Game.stats.right = 0; Game.stats.wrong = 0;
      Game.progress.unlocked = CHAPTERS.length;
      this.save();
      enterChapter(0);
    };
  },

  /* ---------------- 记忆墙 ---------------- */
  openBag(){
    let html = '<div class="memgrid">';
    CHAPTERS.forEach((ch, ci) => {
      ch.cards.forEach((cd, k) => {
        const on = !!Game.progress.got[ci + ':' + k];
        html += '<div class="memcard' + (on ? '' : ' lock') + '" data-ci="' + ci + '" data-k="' + k + '">' +
          '<div class="y">' + (on ? cd.yy : '未解锁') + '</div>' +
          '<div class="t">' + (on ? cd.title : '第 ' + (ci + 1) + ' 章 · ' + ch.pick) + '</div></div>';
      });
    });
    html += '</div>';
    this.openPanel('记忆墙 · ' + Object.keys(Game.progress.got).length + ' / ' + totalCards(), html);
    this.panelWrap.querySelectorAll('.memcard').forEach(el => {
      el.onclick = () => {
        const ci = +el.dataset.ci, k = +el.dataset.k;
        if (!Game.progress.got[ci + ':' + k]) return;
        const cd = CHAPTERS[ci].cards[k];
        this.openPanel(cd.title,
          '<div class="help"><p style="color:#a8743a;font-size:11px;letter-spacing:2px;margin-bottom:10px">' +
          cd.yy + ' ｜ 第 ' + (ci + 1) + ' 章 · ' + CHAPTERS[ci].name + '</p>' +
          '<p style="font-size:14.5px;line-height:2.1">' + cd.text + '</p>' +
          '<p style="margin-top:14px;font-size:11px;color:#9b8a72">史料 · ' + cd.src + '</p></div>');
        const back = document.createElement('div');
        back.style.cssText = 'margin-top:14px;text-align:right';
        back.innerHTML = '<button class="btn ghost" style="font-size:12px">返回记忆墙</button>';
        back.querySelector('button').onclick = () => this.openBag();
        this.panelWrap.querySelector('#pBody').appendChild(back);
      };
    });
  },

  openHelp(){
    const html =
      '<div class="help">' +
      '<p><b>怎么玩？</b>你是一名 2026 级新生，在校史馆的旧校徽里醒来，回到了 1956 年。' +
      '沿着时间轴走过 8 个年代，在每一座校园里收集 3 片「记忆碎片」，回到校门回答一道校史题，就能推开下一道时光之门。</p>' +
      '<div class="kbdrow"><span class="kb">W A S D / ↑ ↓ ← →</span><span class="kb">E 或 空格：互动</span>' +
      '<span class="kb">空格：继续对话</span><span class="kb">1—4：选择答案</span><span class="kb">Esc：菜单</span></div>' +
      '<p style="margin-top:12px"><b>玩的时候注意</b><br>发光的是记忆碎片，走近按 E 就能读；' +
      '集齐了校门会亮，回去按 E 答题；进度存在浏览器里，关了再开还在。</p>' +
      '<p style="margin-top:12px"><b>史实</b><br>年份、校名、隶属关系、各项数据都来自学校官网和公开报道，' +
      '每张卡片底下标了出处。个别地方官网没写清楚（比如下沙校区哪年启用），我就没写具体年份，' +
      '宁缺毋滥。</p>' +
      '<p style="margin-top:12px"><b>说明</b><br>作业要求不能完全由 AI 代做。程序是边查资料边写出来的，' +
      '中间用了 AI 帮忙改代码和润色；史实一条条核过，故事和取舍是我自己的。</p>' +
      '<div style="margin-top:14px;text-align:right"><button class="btn ghost" id="hSrc" style="font-size:12px">查看史料来源</button></div>' +
      '</div>';
    this.openPanel('玩法说明', html);
    this.panelWrap.querySelector('#hSrc').onclick = () => this.openSources();
  },

  openAuthorNote(){
    let html = '<div class="help hand">';
    html += '<p class="hand-lead">写这个的时候的一些事，和游戏本身关系不大，愿意看就看。</p>';
    AUTHOR_NOTE.forEach(function(item){
      html += '<p class="hand-h">' + item[0] + '</p><p class="hand-p">' + item[1] + '</p>';
    });
    html += '<p class="hand-sign">2026.11.6 夜，于下沙</p></div>';
    this.openPanel('作者手记', html);
  },

  openSources(){
    let html = '<div class="help">';
    SOURCES.forEach(s => { html += '<p style="font-size:12.5px;border-left:3px solid #e0d2b5;padding-left:10px;margin-bottom:9px">' + s + '</p>'; });
    html += '<p style="margin-top:10px;font-size:11.5px;color:#9b8a72">部分场景为艺术化想象，人物与对话为虚构，史实以标注出处为准。</p></div>';
    this.openPanel('史料来源', html);
  },

  openMenu(){
    const html = '<div class="help"><p>当前章节：<b>第 ' + (Game.chIndex + 1) + ' 章 · ' +
      CHAPTERS[Game.chIndex].year + ' ' + CHAPTERS[Game.chIndex].name + '</b></p>' +
      '<p>已收集记忆碎片：<b>' + Object.keys(Game.progress.got).length + ' / ' + totalCards() + '</b></p>' +
      '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">' +
      '<button class="btn sm" id="mResume">继续游戏</button>' +
      '<button class="btn ghost" id="mPick">章节选择</button>' +
      '<button class="btn ghost" id="mBag">记忆墙</button>' +
      '<button class="btn ghost" id="mTitle">回到标题</button></div></div>';
    this.openPanel('菜单', html);
    this.panelWrap.querySelector('#mResume').onclick = () => this.closePanel();
    this.panelWrap.querySelector('#mPick').onclick = () => { this.closePanel(); this.showPick(); };
    this.panelWrap.querySelector('#mBag').onclick = () => this.openBag();
    this.panelWrap.querySelector('#mTitle').onclick = () => { this.closePanel(); this.showTitle(); };
  },

  openPanel(title, html){
    this.panelWrap.querySelector('#pTitle').textContent = title;
    this.panelWrap.querySelector('#pBody').innerHTML = html;
    show(this.panelWrap, true);
  },
  closePanel(){ show(this.panelWrap, false); },

  /* ---------------- 导出记忆卡 ---------------- */
  exportCard(){
    const c2 = this.buildCardCanvas();
    const a = document.createElement('a');
    a.download = '七秩杭电时光-我的记忆卡.png';
    a.href = c2.toDataURL('image/png');
    a.click();
    this.toast('记忆卡已保存到下载文件夹');
  },
  buildCardCanvas(){
    const W = 760, H = 1140;
    const c2 = document.createElement('canvas');
    c2.width = W; c2.height = H;
    const g = c2.getContext('2d');

    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#7d0b1e'); bg.addColorStop(.55, '#5c0716'); bg.addColorStop(1, '#2c0409');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    const rg = g.createRadialGradient(W / 2, 300, 40, W / 2, 300, 520);
    rg.addColorStop(0, 'rgba(227,180,101,.18)'); rg.addColorStop(1, 'rgba(227,180,101,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);

    // 边框
    g.strokeStyle = 'rgba(227,180,101,.55)'; g.lineWidth = 2;
    g.strokeRect(28, 28, W - 56, H - 56);
    g.strokeStyle = 'rgba(227,180,101,.22)'; g.lineWidth = 1;
    g.strokeRect(40, 40, W - 80, H - 80);

    g.textAlign = 'center';
    g.fillStyle = '#e3b465'; g.font = '13px ' + FONT_S;
    g.fillText('杭 州 电 子 科 技 大 学', W / 2, 96);
    g.fillStyle = 'rgba(247,224,176,.6)'; g.font = '11px ' + FONT_S;
    g.fillText('1 9 5 6  —  2 0 2 6', W / 2, 120);

    // 70 印章
    g.save();
    g.beginPath(); g.arc(W / 2, 200, 52, 0, 6.2832);
    g.strokeStyle = 'rgba(227,180,101,.7)'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#f7e0b0'; g.font = 'bold 58px ' + FONT_S;
    g.textBaseline = 'middle'; g.fillText('70', W / 2, 206);
    g.restore();

    g.fillStyle = '#fff3d8'; g.font = 'bold 44px ' + FONT_S;
    g.textBaseline = 'alphabetic';
    g.fillText('笃学力行　守正求新', W / 2, 320);
    g.fillStyle = 'rgba(247,224,176,.75)'; g.font = '14px ' + FONT_S;
    g.fillText('国家大事　千万尽力', W / 2, 358);

    // 统计
    const got = Object.keys(Game.progress.got).length;
    const total = totalCards();
    const sec = Math.round(Game.stats.playSeconds);
    const acc = Game.stats.right + Game.stats.wrong > 0
      ? Math.round(Game.stats.right / (Game.stats.right + Game.stats.wrong) * 100) : 100;
    const stats = [[got + '/' + total, '记忆碎片'], [acc + '%', '问答正确率'],
                   [Math.floor(sec / 60) + '′' + String(sec % 60).padStart(2, '0') + '″', '穿越用时']];
    stats.forEach((s, i) => {
      const x = W / 2 + (i - 1) * 200;
      g.fillStyle = '#fff3d8'; g.font = 'bold 30px ' + FONT_S;
      g.fillText(s[0], x, 440);
      g.fillStyle = 'rgba(247,224,176,.55)'; g.font = '11px ' + FONT_S;
      g.fillText(s[1], x, 464);
    });

    // 分隔
    g.strokeStyle = 'rgba(227,180,101,.3)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(120, 500); g.lineTo(W - 120, 500); g.stroke();

    // 祝福
    const bless = (Game.progress.bless || '').trim() ||
      BLESSINGS[Math.floor(Math.random() * BLESSINGS.length)];
    g.fillStyle = 'rgba(247,224,176,.45)'; g.font = '12px ' + FONT_S;
    g.fillText('致 母 校', W / 2, 546);
    g.fillStyle = '#fdf6e6'; g.font = '24px ' + FONT_S;
    const lines = wrapText(g, '「' + bless + '」', W - 180);
    lines.forEach((ln, i) => g.fillText(ln, W / 2, 590 + i * 40));

    // 记忆点
    let y = 590 + lines.length * 40 + 42;
    g.fillStyle = 'rgba(247,224,176,.42)'; g.font = '11px ' + FONT_S;
    g.fillText('走 过 的 八 段 时 光', W / 2, y);
    y += 26;
    // 八个年代
    const yrs = CHAPTERS.map(c => c.year);
    g.font = '13px ' + FONT_S;
    yrs.forEach((yr, i) => {
      const col = i % 4, row = Math.floor(i / 4);
      const x = W / 2 + (col - 1.5) * 132;
      const yy = y + row * 34;
      g.fillStyle = 'rgba(247,224,176,.16)';
      g.fillRect(x - 44, yy - 14, 88, 24);
      g.fillStyle = '#f0d8a8';
      g.fillText(yr, x, yy + 2);
    });

    // 校训释义
    let qy = y + 74;
    g.strokeStyle = 'rgba(227,180,101,.22)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(150, qy); g.lineTo(W - 150, qy); g.stroke();
    qy += 44;
    g.fillStyle = 'rgba(247,224,176,.42)'; g.font = '11px ' + FONT_S;
    g.fillText('校 训 释 义', W / 2, qy);
    qy += 42;
    MOTTO.forEach((m, i) => {
      const cx = W / 2 + (i % 2 === 0 ? -148 : 148);
      const ry = qy + Math.floor(i / 2) * 46;
      g.fillStyle = '#ecd3a2'; g.font = 'bold 15px ' + FONT_S;
      g.fillText(m.w, cx - 66, ry);
      g.fillStyle = 'rgba(247,224,176,.55)'; g.font = '12px ' + FONT_S;
      g.fillText(m.d, cx + 44, ry);
    });

    // 页脚
    g.fillStyle = 'rgba(247,224,176,.4)'; g.font = '10.5px ' + FONT_S;
    g.fillText('思政实践 ·「纲要」课程 · 主题二 纪念杭州电子科技大学建校70周年', W / 2, H - 78);
    g.fillText(new Date().toLocaleDateString('zh-CN') + ' ｜ 七秩·杭电时光', W / 2, H - 58);

    return c2;
  }
};

/* 画布文字换行 */
function wrapText(c, text, maxW){
  const lines = [];
  let cur = '';
  for (const ch of text){
    const t = cur + ch;
    if (c.measureText(t).width > maxW && cur){ lines.push(cur); cur = ch; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

let GAME_READY = false;
window.addEventListener('DOMContentLoaded', () => boot());

</script>
